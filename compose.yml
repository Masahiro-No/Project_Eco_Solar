# Zones: only the web UI (3000) and the API (8000) are published on all interfaces.
# Everything else (Label Studio, MinIO, MLflow, Grafana, Postgres, Redis, ...) is bound to 127.0.0.1:
# developer tools reachable from the server itself only.
services:
  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./logs:/logs
    command: sh -c "redis-server --appendonly yes 2>&1 | tee /logs/redis.log"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:15.4-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./logs:/logs
    command: postgres -c logging_collector=on -c log_directory=/logs -c log_filename=postgres.log
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Label Studio
  # -------------------------
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_NAME: mydatabase
      POSTGRE_USER: myuser
      POSTGRE_PASSWORD: mypassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_DIR: /logs
    volumes:
      - ./logs:/logs
      # keeps Label Studio's generated SECRET_KEY: without it every recreate invalidates the API token in .env
      - label-studio-data:/label-studio/data
    command: sh -c "label-studio start 2>&1 | tee /logs/label_studio.log"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # MinIO
  # -------------------------
  minio:
    image: minio/minio:latest
    container_name: minio_service
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "admin"
      MINIO_ROOT_PASSWORD: "password"
    volumes:
      - ./minio_data:/data
      - ./logs:/logs
    entrypoint: /bin/sh
    command: -c "minio server /data --console-address ':9001' 2>&1 | tee /logs/minio.log"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # FastAPI (Backend API Server)
  # -------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      database_url: "postgresql+asyncpg://myuser:mypassword@postgres/mydatabase"
      label_studio_url: "http://label-studio:8080"
      label_studio_api_key: "${LABEL_STUDIO_API_KEY:?set LABEL_STUDIO_API_KEY in .env (see .env.example)}"
      minio_endpoint: "minio:9000"
      redis_host: "redis"
      redis_port: "6379"
      ENABLE_RETRAIN: "${ENABLE_RETRAIN:-false}"  # one switch for LSTM and ConvLSTM retraining (.env)
      # admin account (private zone); the password lives in the git-ignored .env
      admin_email: "${ADMIN_EMAIL:-admin@solardss.io}"
      admin_password: "${ADMIN_PASSWORD:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "fastapi"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./backend/api:/app/api
      - ./backend/core:/app/core
      - ./backend/db:/app/db
      - ./backend/main.py:/app/main.py
      - ./backend/scripts:/app/scripts
      - ./model:/app/model
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Frontend (Next.js 15 Web Application)
  # -------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "false"
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Trainer Worker (GPU)
  # -------------------------
  trainer-worker:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: trainer-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "password"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password"
      ENABLE_RETRAIN: "${ENABLE_RETRAIN:-false}"  # one switch for LSTM and ConvLSTM retraining (.env)
      LOG_DIR: /workspace/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "trainer-worker"
      # --- LSTM retrain (อ่าน weather_history/ground_truth_labels จาก Postgres) ---
      DATABASE_URL: "postgresql+psycopg2://myuser:mypassword@postgres/mydatabase"
      RETRAIN_LOOKBACK_DAYS: "45"
      LABEL_STUDIO_URL: "http://label-studio:8080"
      LABEL_STUDIO_API_KEY: "${LABEL_STUDIO_API_KEY:?set LABEL_STUDIO_API_KEY in .env (see .env.example)}"
      RETRAIN_MAX_REGRESSION_RATIO: "1.0"
      # --- ConvLSTM retrain on real satellite frames (starts when a batch of new daytime scans is complete) ---
      CONVLSTM_RETRAIN_THRESHOLD: "50"
      CONVLSTM_RETRAIN_EPOCHS: "6"
      CONVLSTM_LOOKBACK_DAYS: "5"
      CONVLSTM_MAX_TRAIN_SEQUENCES: "300"
      CONVLSTM_MAX_REGRESSION_RATIO: "1.0"
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/workspace/logs
      - ./model:/workspace/model
      - ./service:/workspace/service
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # MLflow (Tracking + Model Registry)
  # -------------------------
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri postgresql://myuser:mypassword@postgres/mydatabase
      --artifacts-destination s3://mlflow/
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Inference Worker
  # -------------------------
  inference-worker:
    build:
      context: ./service
      dockerfile: Dockerfile.inference
    container_name: inference-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "password"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_S3_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "admin"
      AWS_SECRET_ACCESS_KEY: "password"
      LOG_DIR: /workspace/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "inference-worker"
      # --- LSTM + satellite blend: w(t) = BLEND_W0 * exp(-t / BLEND_TAU_MIN), t in minutes ---
      BLEND_W0: "0.9"
      BLEND_TAU_MIN: "102"
      # --- cloud coverage in the AOI around the station ---
      CLOUD_AOI_SIZE_PX: "5"
      CLOUD_REFLECTANCE_THRESHOLD: "0.25"
      # --- missing satellite frames: shift the 12-frame window back at most this far ---
      SATELLITE_MAX_SHIFT_MIN: "30"
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./logs:/workspace/logs
      - ./model:/workspace/model
      - ./service:/workspace/service
      - ./Non_time_series:/workspace/Non_time_series
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------
  # Ingestion Worker (Weather & Satellite Data Fetcher)
  # -------------------------
  ingestion-worker:
    build:
      context: .
      dockerfile: service/Dockerfile.ingestion
    container_name: ingestion-worker
    restart: unless-stopped
    environment:
      database_url: "postgresql+asyncpg://myuser:mypassword@postgres/mydatabase"
      minio_endpoint: "minio:9000"
      minio_access_key: "admin"
      minio_secret_key: "password"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      redis_host: "redis"
      redis_port: 6379
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: "ingestion-worker"
      # the ingestion round also starts the ConvLSTM retrain when this many new daytime scans arrived
      ENABLE_RETRAIN: "${ENABLE_RETRAIN:-false}"
      CONVLSTM_RETRAIN_THRESHOLD: "50"
      OTEL_RESOURCE_ATTRIBUTES: "service.version=0.2.0"
      LOG_DIR: "/workspace/logs"
      PYTHONPATH: "/workspace:/workspace/backend:/workspace/service"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/workspace/logs
      - ./backend:/workspace/backend
      - ./service:/workspace/service
      # read-only: lookback_steps of the deployed LSTM (model_meta.json) decides how much history to send
      - ./model:/workspace/model:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────────────────
  # Observability Stack
  # ─────────────────────────────────────────

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    depends_on:
      - loki
      - tempo

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  # Loki
  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"

  # Tempo
  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4327:4317"

  # Promtail — เก็บ Log จาก Docker Containers ส่งไป Loki
  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # Grafana
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  redis-data:
  postgresql-data:
  label-studio-data:
  minio_data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
